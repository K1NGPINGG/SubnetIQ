services:
  postgres:
    image: postgres:16-alpine
    container_name: subnetiq_postgres
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: subnetiq_redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: subnetiq_backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SECRET_KEY: ${SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      DEBUG: ${DEBUG}
    volumes:
      - ./backend:/app
      - tenant_logos:/app/static/tenants
      - ./.updates:/updates
      - backups:/backups
    # No exposed port on the host - the subnetiq-app nginx proxies to it.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: subnetiq_celery_worker
    network_mode: host
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB}
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    volumes:
      - ./backend:/app
      - /proc/net/arp:/host/arp:ro
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ["celery"]
    command: ["-A", "app.tasks.worker", "worker", "-B", "--loglevel=info"]

  # Main application (standalone by default).
  # Serves the SPA and proxies /api to the backend. It is exposed directly on
  # the host so it can be reached standalone or behind an existing reverse proxy
  # (NPM, Traefik, Caddy, ...). See README -> Deployment Options.
  subnetiq-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: subnetiq_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:80"
    depends_on:
      - backend

  # Optional bundled reverse proxy with HTTPS. Started explicitly with:
  #   docker compose --profile with-proxy up -d
  # SSL behaviour is controlled by SSL_MODE (selfsigned | letsencrypt | custom).
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: subnetiq_nginx
    profiles: ["with-proxy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_SERVICE: ${APP_SERVICE:-subnetiq-app}
      APP_SERVICE_PORT: ${APP_SERVICE_PORT:-80}
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      SSL_MODE: ${SSL_MODE:-selfsigned}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
    volumes:
      # Nginx configuration (template rendered at container start)
      - ./docker/nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./docker/nginx/entrypoint.sh:/entrypoint.sh:ro
      - ./docker/nginx/ssl-setup.sh:/ssl-setup.sh:ro
      # Certificates directory. Structure:
      #   ./certs/selfsigned/           - auto-generated (Mode A)
      #   ./certs/custom/fullchain.pem  - user-provided (Mode C, mount here)
      #   ./certs/letsencrypt-bootstrap/ - bootstrap until real cert issued (Mode B)
      - ./certs:/etc/nginx/certs
      # Let's Encrypt state (Mode B) - also read by Nginx for the live cert
      - ./certbot/conf:/etc/letsencrypt
      # ACME HTTP-01 challenge webroot
      - ./certbot/www:/var/www/certbot
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      - subnetiq-app

  # Optional Let's Encrypt client (SSL_MODE=letsencrypt, with-proxy profile).
  # Obtains the certificate on first start and renews it automatically.
  certbot:
    image: certbot/certbot
    container_name: subnetiq_certbot
    profiles: ["with-proxy"]
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./docker/nginx/certbot-entrypoint.sh:/certbot-entrypoint.sh:ro
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
    entrypoint: ["/bin/sh", "/certbot-entrypoint.sh"]
    depends_on:
      - nginx

  updater:
    image: docker:git
    container_name: subnetiq_updater
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/ipam/GG_IPAM:/home/ipam/GG_IPAM
      - ./.updates:/updates
      - ./updater/updater.sh:/updater/updater.sh:ro
    group_add:
      - "${DOCKER_GID:-999}"
    environment:
      UPDATE_STACK_DIR: /home/ipam/GG_IPAM
      UPDATE_REMOTE: https://github.com/K1NGPINGG/SubnetIQ.git
      UPDATE_DATA_DIR: /updates
    entrypoint: ["/bin/sh"]
    command: ["/updater/updater.sh"]

volumes:
  postgres_data:
  redis_data:
  tenant_logos:
  backups:
